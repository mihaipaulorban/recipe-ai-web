<section class="max-w-2xl mx-auto space-y-6 p-4">
  <a
    routerLink="/"
    class="inline-flex items-center text-sm text-slate-300 hover:text-white hover:underline mb-4"
  >
    ← Torna alla Home
  </a>

  <h1 class="text-3xl font-bold text-slate-100">Generatore di ricette</h1>

  <!-- Lista ingredienti -->
  <div>
    <h2 class="text-lg font-semibold text-slate-200">Ingredienti selezionati</h2>

    <ul class="mt-2 space-y-1 text-slate-300">
      <li *ngFor="let ing of ingredients">• {{ ing }}</li>
    </ul>
  </div>

  <!-- Bottone rigenera -->
  <button
    (click)="regenerate()"
    class="rounded-lg bg-emerald-500 px-4 py-2 text-sm font-semibold text-slate-900 hover:bg-emerald-400 transition"
  >
    Rigenera ricette
  </button>

  <!-- Card ricette -->
  <div class="mt-4">
    <h2 class="text-lg font-semibold text-slate-200">Ricette suggerite</h2>

    <div class="mt-3 grid gap-3">
      <div
        *ngFor="let r of fakeResults"
        class="rounded-lg border border-slate-700 bg-slate-900/60 px-4 py-3 text-slate-100"
      >
        {{ r }}
      </div>
    </div>
  </div>
</section>
